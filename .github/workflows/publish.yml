name: Publish

# Builds the executables. Called by the release workflow (which attaches them to the new release); run it by hand
# with an existing tag to rebuild and re-attach the executables of that release.
on:
  workflow_call:
    inputs:
      version:
        description: Version written into the executables
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and attach the executables to (e.g. 1.2.1)
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            cli_asset_name: europa1400-manager-windows.exe
            gui_asset_name: europa1400-manager-gui-windows.exe
            cli_executable_name: europa1400-manager.exe
            gui_executable_name: europa1400-manager-gui.exe
          - os: ubuntu-latest
            cli_asset_name: europa1400-manager-linux
            gui_asset_name: europa1400-manager-gui-linux
            cli_executable_name: europa1400-manager
            gui_executable_name: europa1400-manager-gui

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: 3.13
          enable-cache: true
          cache-suffix: uv-${{ runner.os }}-3.13

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Version
        shell: bash
        run: echo '__version__ = "${{ inputs.version || inputs.tag || '0.0.0-dev' }}"' > europa1400_manager/_version.py

      - name: Icon (Windows)
        if: runner.os == 'Windows'
        run: uv run python scripts/make_icon.py

      - name: Build with PyInstaller
        run: |
          uv run pyinstaller pyinstaller.spec

      - name: Rename executables (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Move-Item -Path "dist\${{ matrix.cli_executable_name }}" -Destination "dist\${{ matrix.cli_asset_name }}"
          Move-Item -Path "dist\${{ matrix.gui_executable_name }}" -Destination "dist\${{ matrix.gui_asset_name }}"

      - name: Rename executables (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mv dist/${{ matrix.cli_executable_name }} dist/${{ matrix.cli_asset_name }}
          mv dist/${{ matrix.gui_executable_name }} dist/${{ matrix.gui_asset_name }}

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: executables-${{ matrix.os }}
          path: |
            dist/${{ matrix.cli_asset_name }}
            dist/${{ matrix.gui_asset_name }}
          if-no-files-found: error

  attach:
    if: inputs.tag != '' # manual run only (when called, github.event_name is the caller's event)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: executables-*
          merge-multiple: true
          path: assets

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" assets/* --clobber --repo "${{ github.repository }}"
