[project]
name = "europa1400-manager"
version = "0.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "aiohttp>=3.12.14",
    "dataclass-wizard[yaml]>=0.35.0",
    "platformdirs>=4.3",
    "psutil>=7.0",
    "pyside6-essentials>=6.9",
    "python-dotenv>=1.1.0",
    "qasync>=0.27",
    "typer>=0.16.0",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "licensecheck>=2025.1.0",
    "pip>=25.1.1",
    "pip-licenses>=5.0.0",
    "pre-commit>=4.2.0",
    "pyinstaller>=6.14.1",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.11.13",
    "ty>=0.0.85",
    "types-pyyaml>=6.0.12.20250516",
    "types-requests>=2.32.4.20250611",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-material>=9.7.7",
]
test = ["pytest>=8.4.0", "pytest-cov>=6.2.1"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
exclude = ["scripts"]  # MkDocs build helpers (docs dependency group)

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
